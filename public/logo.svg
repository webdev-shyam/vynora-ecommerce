<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48">
  <defs>
    <!-- Main gradient for the icon -->
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <!-- Subtle sheen overlay -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366F1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Icon: Rounded square background -->
  <rect x="2" y="2" width="44" height="44" rx="12" ry="12" fill="url(#iconGrad)" filter="url(#shadow)"/>
  <!-- Sheen overlay on icon -->
  <rect x="2" y="2" width="44" height="44" rx="12" ry="12" fill="url(#sheen)"/>

  <!-- V shape — elegant geometric chevron -->
  <g filter="url(#glow)">
    <path d="M14 14 L24 36 L34 14" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Subtle inner V highlight -->
    <path d="M16 14 L24 32 L32 14" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4"/>
  </g>

  <!-- Small dot accent above V -->
  <circle cx="24" cy="10" r="1.5" fill="#ffffff" opacity="0.7"/>

  <!-- Text: Vynora -->
  <text x="56" y="30" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#111827">Vyn</tspan><tspan fill="#6366F1">ora</tspan>
  </text>

  <!-- Subtle tagline -->
  <text x="57" y="40" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="8" font-weight="500" letter-spacing="2.5" fill="#9CA3AF">
    MARKET
  </text>
</svg>
